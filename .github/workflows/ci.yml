name: TriageAgent CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Core Dependencies & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scikit-learn pydantic pyyaml scipy python-dotenv

      - name: Run Fast Unit & Protocol ID Regression Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

